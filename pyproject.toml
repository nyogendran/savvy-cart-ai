[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "savvycart"
version = "0.1.0"
description = "Condition-aware grocery basket optimizer for the Google Cloud AI Builder Cup"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "google-adk>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pillow>=10.0", "pdfplumber>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
